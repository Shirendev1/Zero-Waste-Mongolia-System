services:
  - type: web
    name: zero-waste-pilot
    env: python
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /info/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zero-waste-db
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: PORT
        value: "7860"

databases:
  - name: zero-waste-db
    engine: postgres
    version: "15"
    plan: standard
